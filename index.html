<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SULTAN SPEEDTEST PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { text-align: center; width: 90%; max-width: 600px; }
        h1 { font-weight: 300; margin-bottom: 30px; }
        .results { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stat-box { background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .value { font-size: 2rem; font-weight: bold; color: var(--primary); }
        .label { font-size: 0.9rem; color: #888; text-transform: uppercase; }
        button { background: var(--primary); color: black; border: none; padding: 15px 40px; border-radius: 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0,255,136,0.4); }
        canvas { margin-top: 30px; max-height: 250px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>SPEEDTEST <span style="color:var(--primary); font-weight: 800;">PRO SULTAN</span></h1>
        
        <div class="results">
            <div class="stat-box">
                <div id="download" class="value">0.0</div>
                <div class="label">Download (Mbps)</div>
            </div>
            <div class="stat-box">
                <div id="upload" class="value">0.0</div>
                <div class="label">Upload (Mbps)</div>
            </div>
        </div>

        <button onclick="startTest()">ابدأ الفحص</button>

        <canvas id="speedChart"></canvas>
    </div>

    <script>
        let chart;
        const ctx = document.getElementById('speedChart').getContext('2d');

        // إعداد الرسم البياني
        function initChart() {
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'السرعة اللحظية',
                        data: [],
                        borderColor: '#00ff88',
                        backgroundColor: 'rgba(0, 255, 136, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true, grid: { color: '#333' } }, x: { grid: { display: false } } }
                }
            });
        }

        async function startTest() {
            if (!chart) initChart();
            const downloadEl = document.getElementById('download');
            const uploadEl = document.getElementById('upload');
            
            // محاكاة للفحص (بإمكانك ربطها بـ Render لاحقاً)
            downloadEl.innerText = "جاري الفحص...";
            
            // مثال لتحريك الرسم البياني
            let speedData = [];
            for(let i=0; i<10; i++) {
                let randomSpeed = (Math.random() * 50 + 20).toFixed(2);
                speedData.push(randomSpeed);
                chart.data.labels.push(i);
                chart.data.datasets[0].data.push(randomSpeed);
                chart.update();
                downloadEl.innerText = randomSpeed;
                await new Promise(r => setTimeout(r, 300));
            }

            uploadEl.innerText = (Math.random() * 20 + 5).toFixed(2);
        }
    </script>
</body>
</html>
