<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedTest Pro | Ping & Speed</title>
    <style>
        :root {
            --primary: #00d2ff; --secondary: #3a7bd5; --bg: #0f172a; --card: rgba(30, 41, 59, 0.7);
        }
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: radial-gradient(circle at top right, #1e293b, #0f172a);
            font-family: 'Segoe UI', Tahoma, sans-serif; color: white;
        }
        .container {
            background: var(--card); backdrop-filter: blur(10px); padding: 40px;
            border-radius: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            width: 100%; max-width: 450px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stat-box { background: rgba(15, 23, 42, 0.5); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
        .stat-value { font-size: 24px; font-weight: bold; color: var(--primary); }
        .gauge-container {
            width: 200px; height: 200px; margin: 0 auto 30px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; border: 6px solid #1e293b;
            border-radius: 50%; transition: all 0.3s ease;
        }
        .gauge-container.active { border-color: var(--primary); box-shadow: 0 0 40px rgba(0,210,255,0.3); }
        .speed-large { font-size: 42px; font-weight: 800; color: white; }
        button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; padding: 15px; font-size: 18px;
            font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%;
        }
        button:disabled { opacity: 0.5; }
        .progress-bar { width: 100%; height: 4px; background: #1e293b; margin-top: 25px; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.1s; }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="font-weight: 300;">SPEEDTEST <span style="color:var(--primary); font-weight: 800;">PRO SULTAN</span></h1>
        
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">زمن الاستجابة (Ping)</div>
                <div class="stat-value"><span id="ping">--</span> <small style="font-size: 14px;">ms</small></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">الحالة</div>
                <div id="status" style="font-size: 14px; color: #94a3b8; margin-top: 5px;">جاهز</div>
            </div>
        </div>

        <div class="gauge-container" id="gauge">
            <div class="speed-large" id="speed">0.0</div>
            <div style="color: #94a3b8;">Mbps</div>
        </div>

        <button id="startBtn" onclick="runFullTest()">ابدأ الفحص الشامل</button>
        
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    </div>

    <script>
        async function runFullTest() {
            const speedDisplay = document.getElementById('speed');
            const pingDisplay = document.getElementById('ping');
            const statusDisplay = document.getElementById('status');
            const btn = document.getElementById('startBtn');
            const progress = document.getElementById('progress');
            const downloadUrl = "https://speed-test-server-qfbv.onrender.com/download";

            btn.disabled = true;
            statusDisplay.innerText = "فحص البنق...";

            try {
                // 1. فحص البنق (Ping)
                const pingStart = performance.now();
                await fetch(downloadUrl, { method: 'HEAD' }); // طلب سريع للرأس فقط
                const pingEnd = performance.now();
                const pingTime = Math.round(pingEnd - pingStart);
                pingDisplay.innerText = pingTime;

                // 2. فحص السرعة
                statusDisplay.innerText = "جاري قياس السرعة...";
                const startTime = performance.now();
                const response = await fetch(downloadUrl);
                const reader = response.body.getReader();
                let receivedLength = 0;
                const totalLength = 10 * 1024 * 1024;

                while(true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    receivedLength += value.length;
                    const duration = (performance.now() - startTime) / 1000;
                    const mbps = ((receivedLength * 8) / (duration * 1048576)).toFixed(1);
                    
                    speedDisplay.innerText = mbps;
                    progress.style.width = (receivedLength / totalLength * 100) + "%";
                }

                statusDisplay.innerText = "اكتمل الفحص ✅";
            } catch (e) {
                statusDisplay.innerText = "خطأ في الاتصال!";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
