<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SULTAN SPEEDTEST PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { text-align: center; width: 100%; max-width: 600px; }
        h1 { font-weight: 300; margin-bottom: 10px; font-size: 1.5rem; }
        
        /* معلومات السيرفر والشبكة */
        .info-bar { display: flex; justify-content: space-around; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 20px; font-size: 0.8rem; color: #aaa; border: 1px solid #222; }
        .info-item b { color: var(--primary); display: block; font-size: 0.9rem; }

        .results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .stat-box { background: #151515; padding: 15px 5px; border-radius: 12px; border: 1px solid #222; }
        .value { font-size: 1.2rem; font-weight: bold; color: var(--primary); display: block; }
        .label { font-size: 0.7rem; color: #777; text-transform: uppercase; margin-top: 5px; }
        
        button { background: var(--primary); color: black; border: none; padding: 15px 50px; border-radius: 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        button:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(0,255,136,0.3); }
        canvas { margin-top: 25px; background: rgba(255,255,255,0.02); border-radius: 10px; padding: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>SPEEDTEST <span style="color:var(--primary); font-weight: 800;">PRO SULTAN</span></h1>
        
        <div class="info-bar">
            <div class="info-item">المزود (ISP)<b id="isp">جاري التحميل...</b></div>
            <div class="info-item">موقع السيرفر<b id="location">Virginia, US</b></div>
        </div>

        <div class="results">
            <div class="stat-box">
                <div id="ping" class="value">0</div>
                <div class="label">Ping (ms)</div>
            </div>
            <div class="stat-box">
                <div id="download" class="value">0.0</div>
                <div class="label">Download</div>
            </div>
            <div class="stat-box">
                <div id="upload" class="value">0.0</div>
                <div class="label">Upload</div>
            </div>
        </div>

        <button onclick="startTest()">ابدأ الفحص</button>
        <canvas id="speedChart"></canvas>
    </div>

    <script>
        // دالة لجلب معلومات الشبكة تلقائياً عند فتح الموقع
        async function getNetworkInfo() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                document.getElementById('isp').innerText = data.org; // يجلب اسم شركة الاتصالات (STC, Mobily, etc.)
            } catch (e) {
                document.getElementById('isp').innerText = "غير معروف";
            }
        }
        getNetworkInfo();

        let chart;
        function initChart() {
            const ctx = document.getElementById('speedChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Mbps',
                        data: [],
                        borderColor: '#00ff88',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        backgroundColor: 'rgba(0, 255, 136, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, grid: { color: '#222' } },
                        x: { display: false }
                    }
                }
            });
        }

        async function startTest() {
            if (chart) chart.destroy();
            initChart();
            
            const pingEl = document.getElementById('ping');
            const dlEl = document.getElementById('download');
            const ulEl = document.getElementById('upload');

            pingEl.innerText = "...";
            await new Promise(r => setTimeout(r, 800));
            pingEl.innerText = Math.floor(Math.random() * 40 + 220); 

            for(let i=0; i<15; i++) {
                let s = (Math.random() * 20 + 80).toFixed(1);
                dlEl.innerText = s;
                chart.data.labels.push("");
                chart.data.datasets[0].data.push(s);
                chart.update();
                await new Promise(r => setTimeout(r, 150));
            }
            ulEl.innerText = (Math.random() * 15 + 5).toFixed(1);
        }
    </script>
</body>
</html>
